spring:
  application:
    name: configserver

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_PATH}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true

server:
  port: 8888

logging:
  file:
    name: ${LOG_CONFIGSERVER}

  level:
    root: INFO
